name: kakebo
description: Lokalna księga domowych rachunków na Androida i iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.6'

dependencies:
  archive: 4.3.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/heroicons/
    - assets/kakebo_kanji.svg
    - assets/third_party/heroicons/
    - assets/third_party/noto_serif/
